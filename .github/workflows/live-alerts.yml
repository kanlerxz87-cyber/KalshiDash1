name: live-alerts

# The alert engine. GitHub Pages is static, so nothing on the site itself can sample the
# exchange while nobody is looking. This workflow is what makes the feed genuinely live:
# it runs tools/live_engine.mjs against the official demo Trade API on a schedule, commits
# the resulting data/live/feed.json, and Pages republishes it.
#
# Sources for everything the engine does: see the header of tools/live_engine.mjs and
# docs/ALERTS.md.
#
# PUBLISHING (rewritten 2026-11-21, session-9bee7c49)
# ----------------------------------------------------
# This workflow used to publish with `git rebase FETCH_HEAD` + `git push`, and every
# scheduled run failed at that step: see the "Commit the new sample" step history and
# flag F-58 on the site's Flagged for Review page. The publish now goes through
# scripts/publish-data.sh, which never merges and never rebases — it moves HEAD onto the
# fetched remote tip, stages only the two files this workflow owns, commits and fast-forwards.
# The helper's behaviour is proved by tools/test_publish.sh, which runs in CI.
#
# The three writers (this one, refresh-data.yml and keepalive.yml) publish disjoint
# pathspecs, and because publishing is a move and never a merge, two of them running at
# the same time can no longer corrupt each other. keepalive.yml additionally owns the
# freshness gate that fails the build if the published feed goes stale.

on:
  # IMPORTANT: GitHub only fires `schedule` for the repository's DEFAULT branch. Once this is
  # merged to main the 10-minute cadence starts automatically; on a feature branch only the
  # manual dispatch and push triggers below can run it.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tools/live_engine.mjs'
      - '.github/workflows/live-alerts.yml'
      - 'scripts/check_alerts.mjs'
      - 'scripts/check-data-workflow-shells.mjs'
      - 'scripts/publish-data.sh'

permissions:
  contents: write

concurrency:
  group: live-alerts
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      # On the schedule this resolves to the default branch; a manual dispatch can target
      # this session's branch so the engine can be exercised before the merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check data workflow shell syntax
        run: node scripts/check-data-workflow-shells.mjs

      - name: Sync the working tree to the remote tip
        # The checkout can be a few minutes behind the branch. Starting from the real tip
        # means the sample is produced by the code that is actually on the branch.
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          git reset --hard FETCH_HEAD

      - name: Offline logic selftest (no network)
        run: node tools/live_engine.mjs --selftest

      - name: Fetch live demo-API sample
        id: sample
        run: |
          set -o pipefail
          node tools/live_engine.mjs --max-series 12 --candle-markets 6 2>&1 | tee /tmp/engine.log
        continue-on-error: true

      - name: Validate the feed
        run: node scripts/check_alerts.mjs

      - name: Publish the new sample
        # Feature branches exercise the engine/validation but do not write data; only main is durable.
        if: github.ref == 'refs/heads/main' && steps.sample.outcome == 'success'
        # Only the two files this workflow owns are published. scripts/publish-data.sh commits
        # on top of the fetched remote tip and fast-forwards, so this can never conflict with
        # another writer and can never revert a file it did not generate.
        run: |
          set -euo pipefail
          bash scripts/publish-data.sh \
            "${{ github.ref_name }}" \
            "data(live): engine sample $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ':(top)data/live/feed.json' \
            ':(top)data/live/state.json'

      - name: Fail the run if the engine could not reach the API
        if: steps.sample.outcome != 'success'
        run: |
          echo "The engine did not complete. Log tail:"
          tail -40 /tmp/engine.log
          # Surface the cause as annotations, because the raw job log is not always
          # downloadable; annotations are always readable through the API.
          tail -12 /tmp/engine.log | while IFS= read -r line; do
            echo "::error::engine: $line"
          done
          exit 1
