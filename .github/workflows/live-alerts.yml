name: live-alerts

# The alert engine. GitHub Pages is static, so nothing on the site itself can sample the
# exchange while nobody is looking. This workflow is what makes the feed genuinely live:
# it runs tools/live_engine.mjs against the official demo Trade API on a schedule, commits
# the resulting data/live/feed.json, and Pages republishes it.
#
# Sources for everything the engine does: see the header of tools/live_engine.mjs and
# docs/ALERTS.md.

on:
  # IMPORTANT: GitHub only fires `schedule` for the repository's DEFAULT branch. Once this is
  # merged to main the 10-minute cadence starts automatically; on a feature branch only the
  # manual dispatch and push triggers below can run it.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tools/live_engine.mjs'
      - '.github/workflows/live-alerts.yml'
      - 'scripts/check_alerts.mjs'
      - 'scripts/check-data-workflow-shells.mjs'

permissions:
  contents: write

concurrency:
  # DELIBERATELY NOT SHARED with the other data writers (session-7dc87913).
  # Measured 2026-11-21T06:49:01Z: a single push to main triggers keepalive, live-alerts AND
  # refresh-data at the same instant. When all three shared one concurrency group, GitHub cancelled
  # the pending ones — run 44877328396 (`keepalive`) completed **cancelled**, i.e. a dropped market
  # sample, which is exactly what this project refuses to treat as acceptable.
  # So each writer keeps its own group, and the safety that serialisation was supposed to give is
  # provided by the publish step instead: on a conflict it regenerates the derived data on the new
  # tip and verifies the ref actually moved.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
  group: live-alerts
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      # On the schedule this resolves to the default branch; a manual dispatch can target
      # this session's branch so the engine can be exercised before the merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check data workflow shell syntax
        run: node scripts/check-data-workflow-shells.mjs

      - name: Offline logic selftest (no network)
        run: node tools/live_engine.mjs --selftest

      - name: Fetch live demo-API sample
        id: sample
        run: |
          set -o pipefail
          node tools/live_engine.mjs --max-series 12 --candle-markets 6 2>&1 | tee /tmp/engine.log
        continue-on-error: true

      - name: Validate the feed
        run: node scripts/check_alerts.mjs

      - name: Commit the new sample
        # Feature branches exercise the engine/validation but do not write data; only main is durable.
        if: github.ref == 'refs/heads/main' && steps.sample.outcome == 'success'
        # Runs whenever a sample was produced and validated, even if a later step fails, so a
        # partial problem never loses real, verified market data.
        # The rebase is no longer allowed to fail silently: the old `|| true` turned a
        # conflicting remote into an opaque push failure (session-dd012e26, F-39).
        run: |
          set -euo pipefail
          git config user.name  "kalshidash1-engine"
          git config user.email "engine@users.noreply.github.com"
          git add data/live/
          if git diff --cached --quiet -- data/live/; then
            echo "No market change in this run — nothing to commit."
          elif [ "$TARGET_BRANCH" != "main" ]; then
            echo "Sample validated on $TARGET_BRANCH; write-back is intentionally restricted to main."
          else
            # FIXED (session-7dc87913, F-61): this loop used to abort the whole run the moment a
            # rebase conflicted, and the three data writers do not share a concurrency group, so
            # two merges seconds apart made the second writer fail (measured on main:
            # keepalive run 44876422837, 2026-11-21T06:37:33Z, "could not push after 3 attempts").
            # data/live/ is REGENERATED every run, so it must never be text-merged: on conflict,
            # discard the commit, fast-forward, re-run the engine, and commit again. The push is
            # then verified against the remote tip instead of trusted.
            #
            # FIXED (session-e50b53f6, F-78): every generated page embeds the feed's generated_at
            # in its "Data as of" header, but this step used to commit data/live/ WITHOUT rebuilding
            # the site, so every engine sample left main stale for `scripts/build-site.mjs --check`
            # (measured on main at 14bfb12, sample 2026-11-21T23:13:19Z: 22 pages stale; the
            # staleness checker inside scripts/check-links.mjs then failed site-qa step 6 on every
            # branch that picked up the new feed, e.g. run 44960909852). keepalive.yml and
            # refresh-data.yml already rebuild before committing; do the same here so each sample
            # commit is self-consistent with the staleness gate in pages.yml.
            node scripts/build-site.mjs >/dev/null 2>&1 || \
              echo "::warning::site rebuild failed; committing the sample without regenerated pages"
            git add data/ '*.html' assets categories
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              git commit -m "data(live): engine sample ${STAMP}" >/dev/null 2>&1 || true

              if ! git fetch origin "$TARGET_BRANCH"; then
                echo "::warning::attempt $attempt: could not fetch origin/$TARGET_BRANCH"
                sleep $((attempt * 5)); continue
              fi

              if git rebase FETCH_HEAD 2>/dev/null; then
                if git push origin "HEAD:$TARGET_BRANCH"; then
                  git fetch -q origin "$TARGET_BRANCH"
                  if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                    echo "Pushed and verified the engine sample on attempt $attempt (remote $TARGET_BRANCH == $(git rev-parse --short HEAD))."
                    PUSHED=true
                    break
                  fi
                  echo "::warning::attempt $attempt: push reported success but the remote tip is not ours"
                fi
              else
                echo "attempt $attempt: rebase conflicted on regenerated data — regenerating instead of merging"
                git rebase --abort 2>/dev/null || true
              fi

              git reset --hard FETCH_HEAD
              echo "regenerating on top of $(git rev-parse --short HEAD)"
              node tools/live_engine.mjs --max-series 12 --candle-markets 6 >/dev/null 2>&1 || \
                echo "::warning::attempt $attempt: engine rerun failed; reusing committed data"
              # F-78 (session-e50b53f6): rebuild the pages on the new tip too, so the regenerated
              # sample commit is self-consistent exactly like the first-pass commit above.
              node scripts/build-site.mjs >/dev/null 2>&1 || true
              git add data/ '*.html' assets categories
              if git diff --cached --quiet -- data/live/; then
                echo "Nothing to publish after regenerating — the branch already has this data."
                PUSHED=true
                break
              fi
              git commit -q -m "data(live): engine sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            done
            if [ "$PUSHED" != true ]; then
              echo "::error::could not publish the engine sample to origin/$TARGET_BRANCH after 5 attempts"
              exit 1
            fi
          fi
        env:
          TARGET_BRANCH: ${{ github.ref_name }}

      - name: Fail the run if the engine could not reach the API
        if: steps.sample.outcome != 'success'
        run: |
          echo "The engine did not complete. Log tail:"
          tail -40 /tmp/engine.log
          # Surface the cause as annotations, because the raw job log is not always
          # downloadable; annotations are always readable through the API.
          tail -12 /tmp/engine.log | while IFS= read -r line; do
            echo "::error::engine: $line"
          done
          exit 1
