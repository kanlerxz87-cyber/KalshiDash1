name: live-alerts

# The alert engine. GitHub Pages is static, so nothing on the site itself can sample the
# exchange while nobody is looking. This workflow is what makes the feed genuinely live:
# it runs tools/live_engine.mjs against the official demo Trade API on a schedule, commits
# the resulting data/live/feed.json, and Pages republishes it.
#
# Sources for everything the engine does: see the header of tools/live_engine.mjs and
# docs/ALERTS.md.

on:
  # IMPORTANT: GitHub only fires `schedule` for the repository's DEFAULT branch. Once this is
  # merged to main the 10-minute cadence starts automatically; on a feature branch only the
  # manual dispatch and push triggers below can run it.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tools/live_engine.mjs'
      - '.github/workflows/live-alerts.yml'
      - 'scripts/check_alerts.mjs'

permissions:
  contents: write

# Shared with refresh-data.yml: both bots commit to the same branch, so they must not overlap.
concurrency:
  group: writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      # On the schedule this resolves to the default branch; a manual dispatch can target
      # this session's branch so the engine can be exercised before the merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline logic selftest (no network)
        run: node tools/live_engine.mjs --selftest

      - name: Fetch live demo-API sample
        id: sample
        run: |
          set -o pipefail
          node tools/live_engine.mjs --max-series 12 --candle-markets 6 2>&1 | tee /tmp/engine.log
        continue-on-error: true

      - name: Validate the feed
        run: node scripts/check_alerts.mjs

      - name: Commit the new sample
        # Runs whenever a sample was produced and validated, even if a later step fails, so a
        # partial problem never loses real, verified market data.
        if: steps.sample.outcome == 'success' && success() || steps.sample.outcome == 'success'
        run: |
          set -e
          git config user.name  "kalshidash1-engine"
          git config user.email "engine@users.noreply.github.com"
          git add data/live/
          if git diff --cached --quiet -- data/live/; then
            echo "No market change in this run — nothing to commit."
          else
            STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            git commit -m "data(live): engine sample ${STAMP}"
            BRANCH="${GITHUB_REF_NAME}"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
                pushed=1; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::could not push the engine sample after 3 attempts"
              exit 1
            fi
          fi

      - name: Fail the run if the engine could not reach the API
        if: steps.sample.outcome != 'success'
        run: |
          echo "The engine did not complete. Log tail:"
          tail -40 /tmp/engine.log
          # Surface the cause as annotations, because the raw job log is not always
          # downloadable; annotations are always readable through the API.
          tail -12 /tmp/engine.log | while IFS= read -r line; do
            echo "::error::engine: $line"
          done
          exit 1

      # OPTIONAL chain hint. Measured 2026-11-20: a dispatch made with the repository's own
      # `GITHUB_TOKEN` returns 204 but does not create a run in another workflow, and a workflow
      # file added on a branch other than the default is not registered at all. The reliable
      # driver is `keepalive.yml`, which samples both feeds inline on a schedule. This step only
      # helps if a fine-grained PAT with Actions:write is stored as SELF_DISPATCH_TOKEN; without
      # it the step reports that fact instead of pretending the chain continued.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      - name: Queue the next run (only with SELF_DISPATCH_TOKEN)
        if: always()
        env:
          SELF_DISPATCH_TOKEN: ${{ secrets.SELF_DISPATCH_TOKEN }}
        run: |
          if [ -z "${SELF_DISPATCH_TOKEN}" ]; then
            echo "::notice::No SELF_DISPATCH_TOKEN secret; the scheduled driver is keepalive.yml, which samples inline."
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SELF_DISPATCH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-alerts.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" || true)
          echo "dispatch HTTP ${CODE}"
          case "${CODE}" in
            204|200) echo "Queued the next run." ;;
            *) echo "::warning::dispatch refused (HTTP ${CODE}); keepalive.yml remains the driver." ;;
          esac
