name: site-qa

# Static site: "build" = validate structure, internal links, JS syntax and API-client logic.
# Complements .github/workflows/pages.yml (which regenerates the root site and checks staleness).
# Runs on every push and PR so a broken site can never be merged silently.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal links across the whole published tree (root, docs/, archive/)
        run: python tools/linkcheck.py

      # session-444e829d (S1): the data workflows commit with GITHUB_TOKEN and run on cron.
      # A read-only token, a detached-HEAD push, a swallowed rebase or a cron GitHub cannot
      # honour fails silently — the site keeps saying "live" over stale data (F-39/F-40).
      - name: Workflow contract check (schedules, push refspecs, token permissions)
        run: node scripts/check_workflows.mjs --selftest && node scripts/check_workflows.mjs

      - name: Root-site link and template check (project checker)
        run: node scripts/check-links.mjs

      - name: Check JavaScript syntax
        run: |
          set -e
          shopt -s nullglob
          for f in docs/assets/*.js assets/*.js assets/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: API-client logic tests (mocked, documented response shapes)
        run: node tools/qa_logic_test.mjs

      # session arena-f89b55f7: alert-engine + Live Alerts page tests
      - name: Alert-engine logic tests (swing detection, ROI model, strategies)
        run: node tools/alerts-qa.mjs

      - name: Live Alerts page render test (jsdom, mocked API transport)
        run: |
          npm install --no-save --silent jsdom@24.1.3
          node tools/alerts-render-test.mjs

      - name: Python tool syntax
        run: python -m py_compile tools/*.py
