name: site-qa

# Static site: "build" = validate structure, internal links, JS syntax and API-client logic.
# Complements .github/workflows/pages.yml (which regenerates the root site and checks staleness).
# Runs on every push and PR so a broken site can never be merged silently.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal links across the whole published tree (root, docs/, archive/)
        run: python tools/linkcheck.py

      - name: Root-site link and template check (project checker)
        run: node scripts/check-links.mjs

      - name: Check JavaScript syntax
        run: |
          set -e
          shopt -s nullglob
          for f in docs/assets/*.js assets/*.js assets/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: API-client logic tests (mocked, documented response shapes)
        run: node tools/qa_logic_test.mjs

      # session arena-f89b55f7: alert-engine + Live Alerts page tests
      - name: Alert-engine logic tests (swing detection, ROI model, strategies)
        run: node tools/alerts-qa.mjs

      - name: Live Alerts page render test (jsdom, mocked API transport)
        run: |
          npm install --no-save --silent jsdom@24.1.3
          node tools/alerts-render-test.mjs

      # session-7dc87913: the lab test previously failed on every clean checkout because the
      # documented-optional data/dash-quality.json is absent (F-59). It is now created for the
      # duration of the test and removed afterwards, so the page render assertions are actually
      # enforced in CI instead of being skipped or red for an unrelated reason.
      # session-7dc87913: pins the data-writer publish path (one shared concurrency group, verify
      # the ref moved, regenerate rather than text-merge on conflict). Static, no network.
      - name: Data-writer publish path checks
        run: node scripts/check-data-writer-concurrency.mjs

      - name: Data workflow shell syntax (all three writers)
        run: node scripts/check-data-workflow-shells.mjs

      - name: Catalyst + strategy lab render tests (jsdom)
        run: node scripts/check_lab.mjs

      - name: Python tool syntax
        run: python -m py_compile tools/*.py

      # A stale conflict can be auto-merged as text and published (it happened to README.md
      # twice in this repo). Fail the build if a marker survives into a published file.
      - name: No unresolved merge markers in published files
        run: |
          set -e
          if grep -rn '^<<<<<<< \|^>>>>>>> ' \
               --include='*.html' --include='*.tpl' --include='*.md' \
               --include='*.css' --include='*.js' --include='*.mjs' --include='*.yml' \
               --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::unresolved merge markers found in the tree above"
            exit 1
          fi
          echo "No unresolved merge markers."
