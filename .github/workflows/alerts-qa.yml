name: alerts-qa

# Tests for the live alert engine and the two-chat console (session-cb49437b).
# Complements pages.yml (root-site staleness), site-qa.yml (whole-tree links) and
# suite-qa.yml (dash/). Runs on every push and PR, so a broken alert page or a feed that
# violates the threshold/source rules can never reach main.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev-only test tooling
        run: npm install --no-audit --no-fund

      - name: Engine logic selftest (offline, no network)
        run: node tools/live_engine.mjs --selftest

      - name: Validate the committed engine feed (if the engine has produced one)
        run: node scripts/check_alerts.mjs

      - name: Render the alert page in jsdom and assert its behaviour
        run: node scripts/check_alerts_page.mjs

      # Proves the honesty guarantee: the header badge shows the MEASURED age of the last
      # engine sample and degrades to STALE, and never claims live when the feed is unreadable.
      - name: Freshness badge reports measured age (jsdom)
        run: node scripts/check_freshness_badge.mjs

      - name: JavaScript syntax
        run: |
          set -e
          for f in alerts/js/*.js assets/freshness.js tools/live_engine.mjs \
                   tools/freshness_check.mjs tools/recollapse_feed.mjs \
                   scripts/keepalive.mjs \
                   scripts/check_alerts.mjs scripts/check_alerts_page.mjs \
                   scripts/check_freshness_badge.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      # The staleness gate is exercised in --report-only mode here: on a pull request the feed is
      # whatever the branch has, and failing CI for an old sample would make every PR red for a
      # reason the PR cannot fix. The hard failure lives in keepalive.yml, which runs on a schedule
      # and is the thing that actually keeps the feed fresh.
      - name: Freshness tooling works (structure + thresholds, report-only on PRs)
        run: |
          node tools/freshness_check.mjs --warn-minutes 20 --stale-minutes 45 || \
            echo "::warning::the published feed is older than the stale limit on this branch — see keepalive.yml"
          node scripts/keepalive.mjs --dry-run --stale-minutes 15 || true

      - name: Link check (whole tree + root template)
        run: |
          node scripts/check-links.mjs
          python3 tools/linkcheck.py
