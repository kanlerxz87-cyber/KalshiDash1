name: Refresh demo data snapshot

# Re-captures data/snapshot.json from the official Kalshi DEMO Trade API (public,
# unauthenticated endpoints) and regenerates the static site so the committed
# fallback data and the published pages never drift apart.
#
# The visitor's browser always prefers live data; this job only refreshes the
# committed fallback used when the browser cannot reach the demo API.
#
# Docs: https://docs.kalshi.com/getting_started/demo_env
#
# PUBLISHING (rewritten 2026-11-21, session-9bee7c49)
# ----------------------------------------------------
# This workflow used to publish with `git rebase FETCH_HEAD` + `git push`, and every
# scheduled run failed at that step: see the "Commit refreshed data" step history and
# flag F-58 on the site's Flagged for Review page. The publish now goes through
# scripts/publish-data.sh, which never merges and never rebases.
#
# The pathspecs below are exact on purpose. `git add -- '*.html'` (the old form) matches
# all 90 HTML files in the tree in git pathspec terms, including the hand-written `archive/`
# copy and `alerts/index.html`, neither of which this build regenerates. `:(top,glob)` is
# anchored at the repository root, so only the 17 root pages and the 5 category pages that
# scripts/build-site.mjs actually writes are staged.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'scripts/fetch-snapshot.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/check-data-workflow-shells.mjs'
      - 'scripts/publish-data.sh'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check data workflow shell syntax
        run: node scripts/check-data-workflow-shells.mjs

      - name: Sync the working tree to the remote tip
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          git reset --hard FETCH_HEAD

      - name: Capture snapshot from the official demo API
        run: node scripts/fetch-snapshot.mjs

      - name: Regenerate the static site
        run: |
          if [ -f scripts/build-site.mjs ]; then node scripts/build-site.mjs; fi

      - name: Check internal links
        run: |
          if [ -f scripts/check-links.mjs ]; then node scripts/check-links.mjs; fi

      - name: Publish the refreshed snapshot
        # Feature branches exercise capture/build/link validation without write-back;
        # only main is the durable publisher of snapshot and generated HTML.
        if: github.ref == 'refs/heads/main'
        # scripts/publish-data.sh commits on top of the fetched remote tip and fast-forwards.
        # It creates no merge commit, so it cannot conflict with the other writers, and it
        # stages only the pathspecs below — so a file another author changed on the branch
        # while this job ran is never reverted.
        run: |
          set -euo pipefail
          bash scripts/publish-data.sh \
            "${{ github.ref_name }}" \
            "chore(data): refresh demo snapshot from the official Kalshi demo API" \
            ':(top)data/snapshot.json' \
            ':(top,glob)*.html' \
            ':(top,glob)categories/*.html'
