name: Refresh demo data snapshot

# Re-captures data/snapshot.json from the official Kalshi DEMO Trade API (public,
# unauthenticated endpoints) and regenerates the static site so the committed
# fallback data and the published pages never drift apart.
#
# The visitor's browser always prefers live data; this job only refreshes the
# committed fallback used when the browser cannot reach the demo API.
#
# Docs: https://docs.kalshi.com/getting_started/demo_env

on:
  workflow_dispatch:
  # Scheduled jobs always run on the repository's default branch (main) and GitHub can delay
  # them under load — https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    - cron: '23 */2 * * *'
  # `main` only. The previous `'arena/**'` wildcard fired this job on every ephemeral session
  # branch, where its commit step lost the race with the session's own push (F-39/F-40).
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-snapshot.mjs'
      - 'scripts/build-site.mjs'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture snapshot from the official demo API
        run: node scripts/fetch-snapshot.mjs

      - name: Regenerate the static site
        run: |
          if [ -f scripts/build-site.mjs ]; then node scripts/build-site.mjs; fi

      - name: Check internal links
        run: |
          if [ -f scripts/check-links.mjs ]; then node scripts/check-links.mjs; fi

      # ROOT CAUSE of the failed run 44752211268 (2026-11-20), all data steps green (F-39):
      #   * `actions/checkout@v4` leaves a detached HEAD, so `git rev-parse --abbrev-ref HEAD`
      #     returns the literal string "HEAD" and the push target was `HEAD:HEAD` -> rejected;
      #   * `set -e` then failed the whole job while the refresh itself had already succeeded.
      # The fix uses the commit SHA (always valid, works detached) and re-checks the ref before
      # pushing. Only `data/snapshot.json` is committed: generated HTML is rebuilt by the
      # `Site build check` workflow, and committing both made two bots race over the same files.
      # A scheduled run checks out the default branch; a manual dispatch may target any branch.
      # Rebase onto whatever ref this run was started from, which is valid in both cases.
      - name: Rebase onto the latest tip of this branch
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Commit refreshed data (only when something changed)
        run: |
          set -euo pipefail
          git config user.name  'kalshidash-bot'
          git config user.email 'kalshidash-bot@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo 'No data change — nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(data): refresh demo snapshot from the official Kalshi demo API'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed refreshed snapshot to ${GITHUB_REF_NAME}."
