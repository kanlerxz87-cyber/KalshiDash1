name: Refresh demo data snapshot

# Re-captures data/snapshot.json from the official Kalshi DEMO Trade API (public,
# unauthenticated endpoints) and regenerates the static site so the committed
# fallback data and the published pages never drift apart.
#
# The visitor's browser always prefers live data; this job only refreshes the
# committed fallback used when the browser cannot reach the demo API.
#
# Docs: https://docs.kalshi.com/getting_started/demo_env

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'scripts/fetch-snapshot.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/check-data-workflow-shells.mjs'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

concurrency:
  # SHARED with keepalive.yml on purpose (session-7dc87913, F-61). These three workflows all
  # commit to the same branch and rewrite overlapping generated files; keepalive.yml's comment
  # already claimed they "queue behind this one (see the shared group name in live-alerts.yml and
  # refresh-data.yml)", but each file declared a *different* group, so they never serialised.
  # Measured consequence: two PRs merged seconds apart made the third writer fail with
  # "could not push after 3 attempts" (keepalive run 44876422837, 2026-11-21T06:37:33Z).
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check data workflow shell syntax
        run: node scripts/check-data-workflow-shells.mjs

      - name: Capture snapshot from the official demo API
        run: node scripts/fetch-snapshot.mjs

      - name: Regenerate the static site
        run: |
          if [ -f scripts/build-site.mjs ]; then node scripts/build-site.mjs; fi

      - name: Check internal links
        run: |
          if [ -f scripts/check-links.mjs ]; then node scripts/check-links.mjs; fi

      - name: Commit refreshed data (only when something changed)
        # Feature branches exercise capture/build/link validation without write-back;
        # only main is the durable publisher of snapshot and generated HTML.
        if: github.ref == 'refs/heads/main'
        # Fixed 2026-11-20 (session-dd012e26). This step used to fail on `main`:
        #   1. `git rev-parse --abbrev-ref HEAD` returns the literal string "HEAD" on
        #      the detached checkout that actions/checkout leaves behind, so the push
        #      target was the invalid refspec "HEAD:HEAD";
        #   2. the push had no rebase, so it lost the race against the concurrent
        #      `live-alerts` job, which pushes data/live/ to the same branch.
        # Both are fixed below: the target branch comes from the event, and the
        # commit is rebased onto the remote branch first.
        run: |
          set -euo pipefail
          echo "Preparing snapshot push: event=$GITHUB_EVENT_NAME ref=$GITHUB_REF target=$TARGET_BRANCH"
          git status --short
          git config user.name  'kalshidash-bot'
          git config user.email 'kalshidash-bot@users.noreply.github.com'
          git add data/snapshot.json
          if [ -f scripts/build-site.mjs ]; then git add -- '*.html' assets categories; fi
          if git diff --cached --quiet; then
            echo 'No data change — nothing to commit.'
          elif [ "$TARGET_BRANCH" != "main" ]; then
            echo "Snapshot checked on $TARGET_BRANCH; write-back is intentionally restricted to main."
          else
            git commit -m 'chore(data): refresh demo snapshot from the official Kalshi demo API'
            # FIXED (session-7dc87913, F-61). The old loop re-ran the SAME `git rebase FETCH_HEAD`
            # up to five times. data/snapshot.json and the generated HTML are rewritten by both
            # data writers, so that rebase conflicts on real content and no number of retries can
            # succeed; a silent no-op rebase had the mirror problem, pushing an ancestor ref and
            # exiting 0 without publishing. Both were reproduced on a scratch remote.
            # snapshot.json is DERIVED data: on conflict, discard the commit, fast-forward, re-run
            # the capture + generator, and commit again. Then confirm the remote tip is ours.
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              if ! git fetch origin "$TARGET_BRANCH"; then
                echo "::warning::attempt $attempt: could not fetch origin/$TARGET_BRANCH"
                sleep $((attempt * 5)); continue
              fi

              if git rebase FETCH_HEAD 2>/dev/null; then
                if git push origin "HEAD:$TARGET_BRANCH"; then
                  git fetch -q origin "$TARGET_BRANCH"
                  if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                    echo "Pushed and verified the refreshed snapshot on attempt $attempt (remote $TARGET_BRANCH == $(git rev-parse --short HEAD))."
                    PUSHED=true
                    break
                  fi
                  echo "::warning::attempt $attempt: push reported success but the remote tip is not ours"
                fi
              else
                echo "attempt $attempt: rebase conflicted on regenerated data — regenerating instead of merging"
                git rebase --abort 2>/dev/null || true
              fi

              git reset --hard FETCH_HEAD
              echo "regenerating on top of $(git rev-parse --short HEAD)"
              node scripts/fetch-snapshot.mjs >/dev/null 2>&1 || \
                echo "::warning::attempt $attempt: snapshot capture failed; reusing the committed snapshot"
              node scripts/build-site.mjs >/dev/null 2>&1 || true
              git add data/snapshot.json
              if [ -f scripts/build-site.mjs ]; then git add -- '*.html' assets categories; fi
              if git diff --cached --quiet; then
                echo "Nothing to publish after regenerating — the branch already has this snapshot."
                PUSHED=true
                break
              fi
              git commit -q -m 'chore(data): refresh demo snapshot from the official Kalshi demo API'
            done
            if [ "$PUSHED" != true ]; then
              echo "::error::could not publish the refreshed snapshot to origin/$TARGET_BRANCH after 5 attempts"
              exit 1
            fi
          fi
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
