name: Refresh demo data snapshot

# Re-captures data/snapshot.json from the official Kalshi DEMO Trade API (public,
# unauthenticated endpoints) and regenerates the static site so the committed
# fallback data and the published pages never drift apart.
#
# The visitor's browser always prefers live data; this job only refreshes the
# committed fallback used when the browser cannot reach the demo API.
#
# Docs: https://docs.kalshi.com/getting_started/demo_env
#
# FAILURE THIS FIXES (measured, PR run 44752211268 on main, 2026-11-20T14:18:40Z)
# ---------------------------------------------------------------------------
# The job failed at "Commit refreshed data". The refresh step itself succeeded; the push lost a
# race against the engine bot, which committed to `main` at the same second from the `live-alerts`
# workflow that the merge had just started. `git push` returns non-fast-forward in that case and
# `set -e` failed the job. Nothing had changed in data/snapshot.json, so no data was lost — but a
# permanently red job trains everyone to ignore a red job, which is how a silent stall survives.
#
# The fix is the standard rebase-and-retry loop (three attempts), which is what makes two bots
# writing to one branch safe. It does not force-push and never discards the other bot's commit.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'scripts/fetch-snapshot.mjs'
      - 'scripts/build-site.mjs'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

# `live-alerts` and this workflow both push commits to the same branch. Sharing one concurrency
# group means the second one queues instead of colliding; the retry loop above covers the rest.
concurrency:
  group: writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture snapshot from the official demo API
        run: node scripts/fetch-snapshot.mjs

      - name: Regenerate the static site
        run: |
          if [ -f scripts/build-site.mjs ]; then node scripts/build-site.mjs; fi

      - name: Check internal links
        run: |
          if [ -f scripts/check-links.mjs ]; then node scripts/check-links.mjs; fi

      - name: Commit refreshed data (only when something changed)
        run: |
          set -euo pipefail
          git config user.name  'kalshidash-bot'
          git config user.email 'kalshidash-bot@users.noreply.github.com'
          git add data/snapshot.json
          if [ -f scripts/build-site.mjs ]; then git add -- '*.html' assets categories; fi
          if git diff --cached --quiet; then
            echo 'No data change — nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(data): refresh demo snapshot from the official Kalshi demo API'
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # Another bot (the alert engine) also commits to this branch. Rebase onto whatever
          # landed in the meantime and retry instead of failing on a non-fast-forward.
          for attempt in 1 2 3; do
            echo "push attempt ${attempt}/3 to ${BRANCH}"
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::could not push after 3 attempts; another writer is committing to ${BRANCH} continuously"
          exit 1

      # OPTIONAL chain hint. Measured 2026-11-20: a dispatch made with the repository's own
      # `GITHUB_TOKEN` returns 204 but does not create a run in another workflow, and a workflow
      # file added on a branch other than the default is not registered at all. The reliable
      # driver is `keepalive.yml`, which samples both feeds inline on a schedule. This step only
      # helps if a fine-grained PAT with Actions:write is stored as SELF_DISPATCH_TOKEN; without
      # it the step reports that fact instead of pretending the chain continued.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      - name: Queue the next run (only with SELF_DISPATCH_TOKEN)
        if: always()
        env:
          SELF_DISPATCH_TOKEN: ${{ secrets.SELF_DISPATCH_TOKEN }}
        run: |
          if [ -z "${SELF_DISPATCH_TOKEN}" ]; then
            echo "::notice::No SELF_DISPATCH_TOKEN secret; the scheduled driver is keepalive.yml, which samples inline."
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SELF_DISPATCH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-data.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" || true)
          echo "dispatch HTTP ${CODE}"
          case "${CODE}" in
            204|200) echo "Queued the next run." ;;
            *) echo "::warning::dispatch refused (HTTP ${CODE}); keepalive.yml remains the driver." ;;
          esac
