name: probe-chain
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch live-alerts with the built-in token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -sS -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -w '\nHTTP=%{http_code}\n' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-alerts.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
