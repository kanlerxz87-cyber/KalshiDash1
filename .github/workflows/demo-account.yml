# Demo-account snapshot: refreshes data/account.json from the official Kalshi demo API
# using repository secrets (KALSHI_KEY_ID, KALSHI_PRIVATE_KEY). Without secrets the job is a
# no-op and the site stays in "not connected" state. No key ever reaches the repository.
# Owner setup: docs/DEMO_ACCOUNT.md · Verified contract: verification/2026-11-20-d5b935f4.md (C-3, C-8)

name: demo-account

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: demo-account
  cancel-in-progress: false

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check tools/demo_trader.mjs

      - name: Refresh demo-account snapshot (no-op without secrets)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: node tools/demo_trader.mjs account --ci

      - name: Commit data/account.json if changed
        # Published through scripts/publish-data.sh, which never merges: it commits on top of
        # the fetched remote tip and fast-forwards, so this job cannot conflict with the other
        # writers on `main` and cannot revert a file it did not generate.
        run: |
          set -euo pipefail
          bash scripts/publish-data.sh \
            "${GITHUB_REF_NAME:-main}" \
            "demo-account: refresh data/account.json [skip ci]" \
            ':(top)data/account.json'
