name: Site build check

# GitHub Pages serves the repository root from main (legacy source). This workflow
# rebuilds the generated site and fails if it is stale or has broken internal links.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate site, check links, check JS syntax
        run: |
          node scripts/build-site.mjs
          node scripts/check-links.mjs
          node --check assets/app.js
      # F-41/F-42 (session-444e829d): the home page must never label committed-snapshot rows
      # as live. jsdom is installed on demand so the check stays skipped where it is absent.
      - name: Provenance check (snapshot rows are never counted as live)
        run: |
          npm install --no-save --silent jsdom@25
          node scripts/check_provenance.mjs
      - name: Fail if the committed site is stale
        run: |
          if [ -n "$(git status --porcelain -- '*.html' assets categories data)" ]; then
            git status --porcelain -- '*.html' assets categories data
            echo "Generated site is stale: run node scripts/build-site.mjs and commit the result."
            exit 1
          fi
